<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KB1全册拼读" />
  <title>xinxin (Nova) 专属 · 剑桥 KB1 全册12单元自然拼读点读机</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
      background-color: #FFFDF7;
      background-image: radial-gradient(#CBD5E1 1.4px, transparent 1.4px);
      background-size: 22px 22px;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    .bauhaus-card {
      border: 3px solid #1E293B;
      box-shadow: 6px 6px 0px #1E293B;
    }
    .bauhaus-btn {
      border: 2.5px solid #1E293B;
      box-shadow: 3px 3px 0px #1E293B;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }
    .bauhaus-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    .ph-block {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #1E293B;
      box-shadow: 3.5px 3.5px 0px #1E293B;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .ph-block:active {
      transform: scale(0.94);
    }
    .ph-c {
      background-color: #DBEAFE;
      color: #1E3A8A;
    }
    .ph-v {
      background-color: #FEF3C7;
      color: #B45309;
    }
    .ph-s {
      background-color: #F1F5F9;
      color: #94A3B8;
      border-style: dashed;
      border-color: #64748B;
      box-shadow: none;
    }
    .ph-active {
      transform: scale(1.22) translateY(-6px) !important;
      box-shadow: 0 10px 20px -4px rgba(245, 158, 11, 0.6) !important;
      border-color: #EA580C !important;
      background-color: #FDE68A !important;
      color: #9A3412 !important;
      z-index: 20;
    }
    .ph-word-glow {
      transform: scale(1.08) translateY(-3px) !important;
      border-color: #10B981 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.65) !important;
    }
    .syllable-dot {
      font-size: 1.75rem;
      font-weight: 900;
      color: #94A3B8;
      margin: 0 2px;
      align-self: center;
    }
    .space-divider {
      width: 14px;
      display: inline-block;
    }
    @keyframes popStar {
      0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .star-pop {
      animation: popStar 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="flex flex-col text-slate-800">

  <!-- ==================== TOP APP BAR ==================== -->
  <header class="shrink-0 bg-[#FFFDF7] border-b-3 border-slate-800 px-3 sm:px-5 py-2 flex items-center justify-between gap-2 z-30">
    <div class="flex items-center gap-2 min-w-0">
      <div class="shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-amber-400 border-2 border-slate-800 flex items-center justify-center text-xl sm:text-2xl shadow-[2px_2px_0px_#1E293B]">
        🦁
      </div>
      <div class="flex items-center gap-2 min-w-0">
        <h1 class="text-sm sm:text-lg lg:text-xl font-black tracking-tight text-slate-900 truncate">KB1 稳定英音拼读</h1>
        <span class="hidden lg:inline-block text-xs bg-indigo-600 text-white px-2.5 py-0.5 rounded-full font-bold">Unit 1 - Unit 12</span>
      </div>
    </div>

    <!-- Center Mode Switcher -->
    <div class="flex bg-slate-200 p-0.5 sm:p-1 rounded-xl sm:rounded-2xl border-2 border-slate-800 gap-0.5 sm:gap-1 shrink-0">
      <button id="tabDeck" onclick="switchMode('deck')" class="px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm transition-all bg-amber-400 text-slate-900 border-2 border-slate-800 shadow-[1.5px_1.5px_0px_#1E293B] flex items-center gap-1">
        <span>📖</span> <span class="hidden xs:inline sm:inline">巨型大卡</span>
      </button>
      <button id="tabGame" onclick="switchMode('game')" class="px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm transition-all text-slate-700 hover:text-slate-900 flex items-center gap-1">
        <span>🧩</span> <span class="hidden xs:inline sm:inline">听音拼积木</span>
      </button>
      <button id="tabTable" onclick="switchMode('table')" class="px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm transition-all text-slate-700 hover:text-slate-900 flex items-center gap-1">
        <span>📋</span> <span class="hidden xs:inline sm:inline">词库核对</span>
      </button>
    </div>

    <!-- Right Stars & Locked BrE Badge -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="flex items-center gap-1 bg-yellow-100 border-2 border-slate-800 px-2 sm:px-3 py-1 rounded-xl font-black text-amber-900 text-xs sm:text-sm">
        <span>⭐</span>
        <span id="starCount">0</span>
      </div>
      <div class="bg-indigo-50 border-2 border-slate-800 px-2.5 sm:px-3 py-1 rounded-xl font-black text-xs sm:text-sm flex items-center gap-1 shadow-[2px_2px_0px_#1E293B] text-indigo-900">
        <span>🇬🇧</span>
        <span class="hidden md:inline">锁定英音 (en-GB)</span>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">

    <!-- Unit Sidebar -->
    <aside class="shrink-0 bg-white border-b-2 md:border-b-0 md:border-r-3 border-slate-800 p-2 md:p-3 md:w-56 lg:w-64 flex md:flex-col justify-between gap-2 overflow-x-auto md:overflow-y-auto custom-scroll">
      <div id="unitTabs" class="flex md:flex-col gap-1.5 min-w-max md:min-w-0">
        <!-- Injected by renderUnitTabs -->
      </div>

      <div class="hidden md:flex flex-col gap-2 pt-2.5 border-t-2 border-slate-200 shrink-0">
        <button id="autoPlayBtnDesktop" onclick="toggleAutoPlay()" class="bauhaus-btn w-full bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black py-2.5 px-3 rounded-xl text-sm flex items-center justify-center gap-1.5">
          <span id="autoPlayIconDesktop">▶️</span>
          <span id="autoPlayTextDesktop">本单元慢速连播</span>
        </button>
      </div>
    </aside>

    <!-- Content Stage -->
    <main class="flex-1 min-w-0 min-h-0 flex flex-col relative overflow-hidden p-2 sm:p-4">

      <!-- MODE 1: DECK -->
      <section id="deckSection" class="flex-1 flex flex-col justify-between min-h-0 gap-2 sm:gap-3">
        <div id="deckTouchArea" class="flex-1 flex items-center justify-center gap-2 sm:gap-4 min-h-0">
          <button onclick="stepDeck(-1)" class="hidden sm:flex bauhaus-btn shrink-0 w-12 h-24 lg:w-14 lg:h-28 rounded-2xl bg-white hover:bg-amber-100 flex-col items-center justify-center gap-1 text-2xl font-black">
            <span>⬅️</span>
            <span class="text-[11px] text-slate-600">上一词</span>
          </button>

          <div id="bigCardContainer" class="flex-1 max-w-3xl h-full max-h-[580px] bg-white rounded-3xl sm:rounded-[2rem] bauhaus-card p-3.5 sm:p-6 flex flex-col justify-between relative overflow-y-auto custom-scroll">
            <!-- Injected by renderBigCard -->
          </div>

          <button onclick="stepDeck(1)" class="hidden sm:flex bauhaus-btn shrink-0 w-12 h-24 lg:w-14 lg:h-28 rounded-2xl bg-amber-300 hover:bg-amber-200 flex-col items-center justify-center gap-1 text-2xl font-black">
            <span>➡️</span>
            <span class="text-[11px] text-slate-800">下一词</span>
          </button>
        </div>

        <div class="flex sm:hidden items-center justify-between gap-2 shrink-0">
          <button onclick="stepDeck(-1)" class="bauhaus-btn flex-1 bg-white py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1">
            <span>⬅️</span> <span>上一词</span>
          </button>
          <button id="autoPlayBtnMobile" onclick="toggleAutoPlay()" class="bauhaus-btn flex-1 bg-emerald-400 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1">
            <span id="autoPlayIconMobile">▶️</span> <span id="autoPlayTextMobile">单元连播</span>
          </button>
          <button onclick="stepDeck(1)" class="bauhaus-btn flex-1 bg-amber-300 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1">
            <span>下一词</span> <span>➡️</span>
          </button>
        </div>

        <div class="shrink-0 bg-white/95 border-2 border-slate-800 rounded-xl sm:rounded-2xl p-1.5 sm:p-2 flex items-center gap-1.5 overflow-x-auto custom-scroll shadow-[2px_2px_0px_#1E293B]">
          <div id="deckThumbs" class="flex items-center gap-1.5"></div>
        </div>
      </section>

      <!-- MODE 2: GAME -->
      <section id="gameSection" class="hidden flex-1 flex items-center justify-center min-h-0 overflow-y-auto custom-scroll">
        <div class="w-full max-w-3xl bg-white rounded-3xl sm:rounded-[2rem] p-4 sm:p-6 bauhaus-card flex flex-col justify-between my-auto">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-200 pb-2.5 mb-3">
            <div class="flex items-center gap-2">
              <span class="bg-amber-400 border-2 border-slate-800 px-3 py-1 rounded-xl font-black text-xs sm:text-sm">
                第 <span id="gameIndex">1</span> / <span id="gameTotal">10</span> 题
              </span>
              <span id="streakBadge" class="bg-rose-100 text-rose-700 border-2 border-rose-300 px-2.5 py-1 rounded-xl font-black text-xs sm:text-sm">
                🔥 连对 0
              </span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="setGameMode('blocks')" id="gmodeBlocks" class="bauhaus-btn px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-black bg-teal-400 text-slate-900">
                🧱 音节积木拼装
              </button>
            </div>
          </div>

          <div class="flex flex-col items-center text-center">
            <div class="flex items-center gap-3 sm:gap-4 mb-2">
              <div id="gameEmoji" class="text-5xl sm:text-6xl select-none">🚂</div>
              <div class="text-left">
                <div id="gameMeaning" class="text-xl sm:text-2xl font-black text-slate-900">火车</div>
                <div id="gameTip" class="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-300 px-2.5 py-1 rounded-xl mt-1">
                  💡 点击下方积木听纯音素发音并拼出单词
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2.5 my-2">
              <button onclick="playGameAudio(false)" class="bauhaus-btn bg-indigo-500 active:bg-indigo-600 text-white px-4 py-2 rounded-2xl font-black text-xs sm:text-base flex items-center gap-1.5">
                <span>🔊</span> <span>听整词发音</span>
              </button>
              <button onclick="playGameAudio(true)" class="bauhaus-btn bg-amber-400 active:bg-amber-500 text-slate-900 px-4 py-2 rounded-2xl font-black text-xs sm:text-base flex items-center gap-1.5">
                <span>🐢</span> <span>慢速拆音提示</span>
              </button>
            </div>

            <div id="gameSlots" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 min-h-[4.5rem] w-full bg-slate-50 border-3 border-dashed border-slate-300 rounded-2xl p-3 my-2"></div>
            <div id="gameFeedback" class="min-h-[2rem] flex items-center justify-center font-black text-sm sm:text-lg my-1"></div>
            <div id="gamePool" class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3 my-2"></div>

            <div class="flex items-center justify-between w-full pt-2.5 mt-2 border-t-2 border-slate-100">
              <button onclick="resetCurrentQuestion()" class="bauhaus-btn bg-slate-100 text-slate-700 px-3.5 py-2 rounded-xl font-black text-xs sm:text-sm">
                🔄 重拼本题
              </button>
              <button onclick="nextGameQuestion()" class="bauhaus-btn bg-emerald-400 text-slate-900 px-5 py-2 rounded-xl font-black text-xs sm:text-base flex items-center gap-1">
                <span>下一题</span> <span>➡️</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- MODE 3: TABLE / AUDIT -->
      <section id="tableSection" class="hidden flex-1 flex flex-col min-h-0 overflow-hidden">
        <div class="shrink-0 flex flex-wrap items-center justify-between gap-2 mb-3 bg-white p-3 rounded-2xl border-2 border-slate-800">
          <div class="flex items-center gap-2">
            <span class="text-lg">✅</span>
            <span class="text-xs sm:text-sm font-black text-slate-900">
              全册 12 单元已绑定固定英音 ipaTriggerMap 映射表（零字母名 · 纯音素完美对齐）
            </span>
          </div>
          <label class="flex items-center gap-1.5 text-xs font-black text-indigo-900 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200 cursor-pointer">
            <input id="tableShowAllUnits" type="checkbox" checked onchange="renderAuditTable()" class="accent-indigo-600 w-4 h-4" />
            <span>显示全部12单元</span>
          </label>
        </div>

        <div class="flex-1 overflow-auto custom-scroll bg-white rounded-2xl border-2 border-slate-800">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead class="sticky top-0 bg-slate-900 text-white font-black z-10">
              <tr>
                <th class="p-2.5 border-b border-slate-700">单元</th>
                <th class="p-2.5 border-b border-slate-700">单词 / 短语</th>
                <th class="p-2.5 border-b border-slate-700">中文释义</th>
                <th class="p-2.5 border-b border-slate-700">整词英音 (DJ IPA)</th>
                <th class="p-2.5 border-b border-slate-700">色块拆分 (点击试听)</th>
                <th class="p-2.5 border-b border-slate-700">音标</th>
                <th class="p-2.5 border-b border-slate-700">拼读规则说明</th>
              </tr>
            </thead>
            <tbody id="auditTableBody" class="divide-y divide-slate-200 font-bold">
              <!-- Injected by renderAuditTable -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script>
    // ==================== 1. FIXED BrE IPA -> STABLE TRIGGER MAP (NO ALPHABET NAMES) ====================
    // Mandatory Rule II: Every IPA phoneme maps to a robust trigger text pronounced as a pure phoneme.
    const ipaTriggerMap = {
      // Short Vowels
      '/æ/': 'hat',
      '/ɒ/': 'hot',
      '/ɪ/': 'hit',
      '/ʌ/': 'cup',
      '/e/': 'bed',
      '/ʊ/': 'book',
      '/ə/': 'about',

      // Long Vowels
      '/iː/': 'see',
      '/ɑː/': 'car',
      '/ɔː/': 'door',
      '/uː/': 'moon',
      '/ɜː/': 'bird',

      // Diphthongs
      '/eɪ/': 'day',
      '/aɪ/': 'high',
      '/ɔɪ/': 'boy',
      '/aʊ/': 'cow',
      '/əʊ/': 'snow',
      '/ɪə/': 'ear',
      '/eə/': 'air',

      // Consonants (Strong / Double Forms to prevent alphabet names)
      '/p/': 'pp',
      '/b/': 'bb',
      '/t/': 'tt',
      '/d/': 'dd',
      '/k/': 'ck',
      '/ɡ/': 'gg',
      '/f/': 'ff',
      '/v/': 'v',
      '/θ/': 'think',
      '/ð/': 'this',
      '/s/': 'ss',
      '/z/': 'zz',
      '/ʃ/': 'sh',
      '/ʒ/': 'measure',
      '/tʃ/': 'ch',
      '/dʒ/': 'j',
      '/m/': 'mm',
      '/n/': 'nn',
      '/ŋ/': 'ng',
      '/ŋk/': 'nk',
      '/h/': 'h',
      '/l/': 'll',
      '/r/': 'r',
      '/w/': 'w',
      '/j/': 'y',
      '/ks/': 'ks',
      '/kw/': 'qu',

      // Blends
      '/bl/': 'bl',
      '/br/': 'br',
      '/kl/': 'cl',
      '/kr/': 'cr',
      '/dr/': 'dr',
      '/fl/': 'fl',
      '/fr/': 'fr',
      '/ɡl/': 'gl',
      '/ɡr/': 'gr',
      '/pl/': 'pl',
      '/pr/': 'pr',
      '/sk/': 'sk',
      '/sl/': 'sl',
      '/sm/': 'sm',
      '/sn/': 'sn',
      '/sp/': 'sp',
      '/st/': 'st',
      '/sw/': 'sw',
      '/tr/': 'tr',
      '/tw/': 'tw',
      '/nd/': 'nd',
      '/nt/': 'nt',

      // Special & Phrases
      '/əʊˈkeɪ/': 'okay',
      '/tiː/': 'tee',
      '/ˌtiːˈviː/': 'television',
      '/aɪm/': "I am",
      '/ˈɪznt/': "isn't"
    };

    // ==================== 2. CORE PHONEME DICTIONARY (222 ITEMS) ====================
    const PHONEME_DICT = {
      'b': { display: 'b', ipa: '/b/', k: 'c' }, 'bb': { display: 'bb', ipa: '/b/', k: 'c' },
      'c': { display: 'c', ipa: '/k/', k: 'c' }, 'ck': { display: 'ck', ipa: '/k/', k: 'c' },
      'ch': { display: 'ch', ipa: '/tʃ/', k: 'c' }, 'd': { display: 'd', ipa: '/d/', k: 'c' },
      'f': { display: 'f', ipa: '/f/', k: 'c' }, 'ff': { display: 'ff', ipa: '/f/', k: 'c' },
      'g': { display: 'g', ipa: '/ɡ/', k: 'c' }, 'ge': { display: 'ge', ipa: '/dʒ/', k: 'c' },
      'h': { display: 'h', ipa: '/h/', k: 'c' }, 'j': { display: 'j', ipa: '/dʒ/', k: 'c' },
      'k': { display: 'k', ipa: '/k/', k: 'c' }, 'l': { display: 'l', ipa: '/l/', k: 'c' },
      'll': { display: 'll', ipa: '/l/', k: 'c' }, 'm': { display: 'm', ipa: '/m/', k: 'c' },
      'n': { display: 'n', ipa: '/n/', k: 'c' }, 'ng': { display: 'ng', ipa: '/ŋ/', k: 'c' },
      'nk': { display: 'nk', ipa: '/ŋk/', k: 'c' }, 'p': { display: 'p', ipa: '/p/', k: 'c' },
      'ph': { display: 'ph', ipa: '/f/', k: 'c' }, 'qu': { display: 'qu', ipa: '/kw/', k: 'c' },
      'r': { display: 'r', ipa: '/r/', k: 'c' }, 's': { display: 's', ipa: '/s/', k: 'c' },
      'ss': { display: 'ss', ipa: '/s/', k: 'c' }, 's_z': { display: 's', ipa: '/z/', k: 'c' },
      'sh': { display: 'sh', ipa: '/ʃ/', k: 'c' }, 't': { display: 't', ipa: '/t/', k: 'c' },
      'tch': { display: 'tch', ipa: '/tʃ/', k: 'c' }, 'th_u': { display: 'th', ipa: '/θ/', k: 'c' },
      'th_v': { display: 'th', ipa: '/ð/', k: 'c' }, 'v': { display: 'v', ipa: '/v/', k: 'c' },
      'w': { display: 'w', ipa: '/w/', k: 'c' }, 'wh': { display: 'wh', ipa: '/w/', k: 'c' },
      'wh_h': { display: 'wh', ipa: '/h/', k: 'c' }, 'x': { display: 'x', ipa: '/ks/', k: 'c' },
      'y_c': { display: 'y', ipa: '/j/', k: 'c' }, 'z': { display: 'z', ipa: '/z/', k: 'c' },

      'bl': { display: 'bl', ipa: '/bl/', k: 'c' }, 'br': { display: 'br', ipa: '/br/', k: 'c' },
      'cl': { display: 'cl', ipa: '/kl/', k: 'c' }, 'cr': { display: 'cr', ipa: '/kr/', k: 'c' },
      'dr': { display: 'dr', ipa: '/dr/', k: 'c' }, 'fl': { display: 'fl', ipa: '/fl/', k: 'c' },
      'fr': { display: 'fr', ipa: '/fr/', k: 'c' }, 'gr': { display: 'gr', ipa: '/ɡr/', k: 'c' },
      'pl': { display: 'pl', ipa: '/pl/', k: 'c' }, 'sk': { display: 'sk', ipa: '/sk/', k: 'c' },
      'sl': { display: 'sl', ipa: '/sl/', k: 'c' }, 'sm': { display: 'sm', ipa: '/sm/', k: 'c' },
      'sn': { display: 'sn', ipa: '/sn/', k: 'c' }, 'st': { display: 'st', ipa: '/st/', k: 'c' },
      'sw': { display: 'sw', ipa: '/sw/', k: 'c' }, 'tr': { display: 'tr', ipa: '/tr/', k: 'c' },

      { u:'u12', w:'wash your hands', ipa:'/wɒʃ jɔː hændz/', zh:'洗手', e:'🧼', b:['w','a_o','sh',' ','y_c','our_or',' ','h','a','nd','s_z'], tip:'wash your hands' }
    ];

    // ==================== 4. BULLETPROOF BrE AUDIO ENGINE (LOCKED en-GB & ipaTriggerMap) ====================
    let currentUnit = 'u1';
    let currentMode = 'deck';
    let currentDeckIndex = 0;
    let lockedUKVoice = null;
    let isAutoPlaying = false;
    let activeSequenceId = 0;
    let stars = 0;
    let streak = 0;

    // Game state
    let gameQueue = [];
    let gameIdx = 0;
    let currentQuestion = null;
    let userBlocks = [];

    function initUKVoiceEngine() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return;
      // Search for high-quality British English voice
      lockedUKVoice = voices.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith('en-gb') && (v.name.includes('Daniel') || v.name.includes('Oliver') || v.name.includes('UK') || v.name.includes('British'))) ||
                      voices.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith('en-gb')) ||
                      voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = initUKVoiceEngine;
      }
    }

    // Master robust speech player with global cancel, en-GB lock, and retry fallback
    function playLockedBrESpeech(text, rate = 1.0, isRetry = false) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window) || !text) {
          resolve();
          return;
        }
        // Requirement I.1: Mandatory global cancel to clear all queued/running audio tasks
        window.speechSynthesis.cancel();

        if (!lockedUKVoice) initUKVoiceEngine();

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; // Requirement I.2: Force locked British English
        u.rate = rate;
        u.pitch = 1.0;
        if (lockedUKVoice) u.voice = lockedUKVoice;

        let settled = false;
        const done = () => {
          if (!settled) {
            settled = true;
            resolve();
          }
        };

        u.onend = done;
        u.onerror = () => {
          // Requirement I.3: Retry once on failure
          if (!isRetry) {
            setTimeout(() => playLockedBrESpeech(text, rate, true).then(done), 120);
          } else {
            done();
          }
        };

        window.speechSynthesis.speak(u);

        // Safety fallback timer
        setTimeout(done, Math.max(2200, text.length * 240));
      });
    }

    // Click Debounce (Requirement I.4: 300ms throttle)
    let lastClickTime = 0;
    function checkThrottle() {
      const now = Date.now();
      if (now - lastClickTime < 300) return false;
      lastClickTime = now;
      return true;
    }

    // Play single phoneme block via ipaTriggerMap lookup
    async function playPhonicsToken(tokenKey, domEl = null) {
      if (!checkThrottle()) return;
      const info = PHONEME_DICT[tokenKey] || { display: tokenKey, ipa: `/${tokenKey}/`, k: 'c' };

      if (domEl) {
        domEl.classList.add('ph-active');
      }

      // Silent letter check
      if (info.k === 's' || info.ipa === '静音') {
        window.speechSynthesis.cancel();
        await new Promise(r => setTimeout(r, 200));
        if (domEl) domEl.classList.remove('ph-active');
        return;
      }

      // Lookup stable trigger text from ipaTriggerMap
      const triggerText = ipaTriggerMap[info.ipa] || info.display || 'hat';
      await playLockedBrESpeech(triggerText, 0.9);

      if (domEl) {
        domEl.classList.remove('ph-active');
      }
    }

    // Event-driven Slow Blending (Requirement IV): onend-chained sequence without fixed timeouts
    async function playWordSlowBlend(wordObj, containerId) {
      if (!checkThrottle()) return;
      activeSequenceId++;
      const seqId = activeSequenceId;
      window.speechSynthesis.cancel();

      const container = document.getElementById(containerId);
      const tileEls = container ? Array.from(container.querySelectorAll('[data-ph-idx]')) : [];
      tileEls.forEach(el => el.classList.remove('ph-active', 'ph-word-glow'));

      let tilePointer = 0;
      for (let i = 0; i < wordObj.b.length; i++) {
        if (seqId !== activeSequenceId) return;
        const token = wordObj.b[i];
        if (token === '.' || token === '-') continue;
        if (token === ' ') {
          await new Promise(r => setTimeout(r, 180));
          continue;
        }

        const currentEl = tileEls[tilePointer++];
        const info = PHONEME_DICT[token] || { display: token, ipa: `/${token}/`, k: 'c' };

        if (info.k === 's' || info.ipa === '静音') {
          if (currentEl) currentEl.classList.add('ph-active');
          await new Promise(r => setTimeout(r, 150));
          if (currentEl) currentEl.classList.remove('ph-active');
          continue;
        }

        if (currentEl) currentEl.classList.add('ph-active');
        const triggerText = ipaTriggerMap[info.ipa] || info.display || 'hat';
        await playLockedBrESpeech(triggerText, 0.9);
        if (currentEl) currentEl.classList.remove('ph-active');

        if (seqId !== activeSequenceId) return;
        // Natural small gap between phonemes
        await new Promise(r => setTimeout(r, 120));
      }

      if (seqId !== activeSequenceId) return;
      await new Promise(r => setTimeout(r, 200));

      // Natural transition to full word reading at 1.0x BrE
      tileEls.forEach(el => el.classList.add('ph-word-glow'));
      const cleanWord = wordObj.w.replace('=is not', ', is not');
      await playLockedBrESpeech(cleanWord, 1.0);
      tileEls.forEach(el => el.classList.remove('ph-word-glow'));
    }

    async function playNormalWord(wordStr, containerId = null) {
      if (!checkThrottle()) return;
      activeSequenceId++;
      window.speechSynthesis.cancel();
      const container = containerId ? document.getElementById(containerId) : null;
      const tileEls = container ? Array.from(container.querySelectorAll('[data-ph-idx]')) : [];
      tileEls.forEach(el => el.classList.add('ph-word-glow'));
      const cleanWord = wordStr.replace('=is not', ', is not');
      await playLockedBrESpeech(cleanWord, 1.0);
      tileEls.forEach(el => el.classList.remove('ph-word-glow'));
    }

    async function playExampleSentence(sentenceStr) {
      if (!checkThrottle()) return;
      activeSequenceId++;
      window.speechSynthesis.cancel();
      await playLockedBrESpeech(sentenceStr, 1.0);
    }

    // ==================== 5. UI RENDERING ====================

    function buildPhonicsBlocksHTML(wordObj, size = 'large') {
      let tileIdx = 0;
      const isPhrase = wordObj.w.length > 10 || wordObj.b.includes(' ');
      const padClass = size === 'large'
        ? (isPhrase ? 'px-2.5 py-1.5 min-w-[2.6rem] rounded-xl' : 'px-3.5 sm:px-5 py-2 sm:py-3 min-w-[3.4rem] sm:min-w-[4.2rem] rounded-2xl')
        : 'px-2 py-1 min-w-[2.1rem] rounded-lg';
      const letterSize = size === 'large'
        ? (isPhrase ? 'text-xl sm:text-3xl' : 'text-3xl sm:text-5xl')
        : 'text-base sm:text-lg';
      const ipaSize = size === 'large' ? 'text-[10px] sm:text-xs' : 'text-[9px]';

      return wordObj.b.map(token => {
        if (token === '.') return `<span class="syllable-dot select-none">·</span>`;
        if (token === '-') return `<span class="syllable-dot select-none">-</span>`;
        if (token === ' ') return `<span class="space-divider"></span>`;
        const info = PHONEME_DICT[token] || { display: token, ipa: `/${token}/`, k: 'c' };
        const displayLetters = info.display || token;
        const kindClass = info.k === 'v' ? 'ph-v' : (info.k === 's' ? 'ph-s' : 'ph-c');
        const idx = tileIdx++;
        const escapedToken = token.replace(/'/g, "\\'");
        return `
          <div data-ph-idx="${idx}" onclick="event.stopPropagation(); playPhonicsToken('${escapedToken}', this)" class="ph-block ${kindClass} ${padClass}">
            <span class="${letterSize} font-black leading-none tracking-tight">${displayLetters}</span>
            <span class="${ipaSize} font-bold opacity-80 mt-1">${info.ipa || ''}</span>
          </div>
        `;
      }).join('');
    }

    function renderDeckThumbs() {

      const activeThumb = document.getElementById(`thumb_${currentDeckIndex}`);

    function stepDeck(delta) {
      stopAutoPlay();
      const list = getUnitWords(currentUnit);
      currentDeckIndex = (currentDeckIndex + delta + list.length) % list.length;
      renderBigCard();
      renderDeckThumbs();
    }

    function jumpToCard(idx) {
      stopAutoPlay();
      currentDeckIndex = idx;
      renderBigCard();
      renderDeckThumbs();

    // ==================== 6. AUTO PLAY LOOP ====================
    async function toggleAutoPlay() {
      if (isAutoPlaying) {
        stopAutoPlay();
        return;
      }
      if (currentMode !== 'deck') switchMode('deck');
      isAutoPlaying = true;
      updateAutoPlayButtons();

      const list = getUnitWords(currentUnit);
      const loopId = ++activeSequenceId;

      while (isAutoPlaying && loopId === activeSequenceId) {
        renderBigCard();
        renderDeckThumbs();
        const item = list[currentDeckIndex];
        await playWordSlowBlend(item, 'bigCardBlocks');
        if (!isAutoPlaying || loopId !== activeSequenceId) break;
        await new Promise(r => setTimeout(r, 600));
        if (!isAutoPlaying || loopId !== activeSequenceId) break;
        currentDeckIndex = (currentDeckIndex + 1) % list.length;
      }
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      activeSequenceId++;
      window.speechSynthesis.cancel();
      updateAutoPlayButtons();
    }

    function updateAutoPlayButtons() {
      const dIcon = document.getElementById('autoPlayIconDesktop');
      const dText = document.getElementById('autoPlayTextDesktop');
      const mIcon = document.getElementById('autoPlayIconMobile');
      const mText = document.getElementById('autoPlayTextMobile');
      if (dIcon) dIcon.textContent = isAutoPlaying ? '⏹️' : '▶️';
      if (dText) dText.textContent = isAutoPlaying ? '停止连播' : '本单元慢速连播';
      if (mIcon) mIcon.textContent = isAutoPlaying ? '⏹️' : '▶️';
      if (mText) mText.textContent = isAutoPlaying ? '停止' : '单元连播';
    }

    // ==================== 7. GAME MODE ====================
    function setGameMode(mode) {
      initGameQueue();
    }

    function initGameQueue() {
      const unitItems = getUnitWords(currentUnit).filter(x => !x.b.includes(' ') && x.b.filter(t => t !== '.').length >= 2);
      gameQueue = [...unitItems].sort(() => Math.random() - 0.5).slice(0, 10);
      gameIdx = 0;
      loadGameQuestion();
    }

    function loadGameQuestion() {
      if (!gameQueue.length) return;
      currentQuestion = gameQueue[gameIdx % gameQueue.length];
      userBlocks = [];
      document.getElementById('gameIndex').textContent = (gameIdx % gameQueue.length) + 1;
      document.getElementById('gameTotal').textContent = gameQueue.length;
      document.getElementById('gameEmoji').textContent = currentQuestion.e;
      document.getElementById('gameMeaning').textContent = currentQuestion.zh;
      document.getElementById('gameTip').textContent = `💡 ${currentQuestion.tip}`;
      document.getElementById('gameFeedback').innerHTML = '';

      const pureTokens = currentQuestion.b.filter(t => t !== '.' && t !== ' ' && t !== '-');
      renderBlockBuildQuestion(pureTokens);
      setTimeout(() => playNormalWord(currentQuestion.w), 250);
    }

    function renderBlockBuildQuestion(pureTokens) {
      const slotsEl = document.getElementById('gameSlots');
      slotsEl.innerHTML = pureTokens.map((_, i) => `
        <div id="gslot_${i}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-2 border-dashed border-slate-400 bg-white flex flex-col items-center justify-center text-slate-300 font-black text-xl">
          ?
        </div>
      `).join('');

      const distractors = ['a', 'e', 'i', 'o', 'u', 's', 't', 'n', 'r', 'l', 'sh', 'ch']
        .filter(d => !pureTokens.includes(d))
        .sort(() => Math.random() - 0.5)
        .slice(0, 2);

      const poolTokens = [...pureTokens, ...distractors].sort(() => Math.random() - 0.5);
      const poolEl = document.getElementById('gamePool');
      poolEl.innerHTML = poolTokens.map((tok, idx) => {
        const info = PHONEME_DICT[tok] || { display: tok, ipa: `/${tok}/`, k: 'c' };
        const disp = info.display || tok;
        const kindClass = info.k === 'v' ? 'ph-v' : (info.k === 's' ? 'ph-s' : 'ph-c');
        const escapedTok = tok.replace(/'/g, "\\'");
        return `
          <button id="gpool_${idx}" onclick="pickGameBlock('${escapedTok}', 'gpool_${idx}', ${pureTokens.length})" class="ph-block ${kindClass} px-4 py-2.5 rounded-2xl min-w-[3.6rem]">
            <span class="text-2xl sm:text-3xl font-black">${disp}</span>
            <span class="text-[10px] font-bold opacity-75">${info.ipa || ''}</span>
          </button>
        `;
      }).join('');
    }

    async function pickGameBlock(token, btnId, targetLen) {
      if (userBlocks.length >= targetLen) return;
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-30', 'scale-90');
      }

      userBlocks.push(token);
      const slotIdx = userBlocks.length - 1;
      const slotEl = document.getElementById(`gslot_${slotIdx}`);
      const info = PHONEME_DICT[token] || { display: token, ipa: `/${token}/`, k: 'c' };
      if (slotEl) {
        slotEl.className = `ph-block ${info.k === 'v' ? 'ph-v' : (info.k === 's' ? 'ph-s' : 'ph-c')} w-16 h-16 sm:w-20 sm:h-20 rounded-2xl`;
        slotEl.innerHTML = `
          <span class="text-2xl sm:text-3xl font-black">${info.display || token}</span>
          <span class="text-[10px] font-bold opacity-75">${info.ipa || ''}</span>
        `;
      }

      await playPhonicsToken(token, slotEl);

      const pureTokens = currentQuestion.b.filter(t => t !== '.' && t !== ' ' && t !== '-');
      if (userBlocks.length === pureTokens.length) {
        const userWord = userBlocks.map(t => (PHONEME_DICT[t]?.display || t)).join('').toLowerCase();
        const targetWord = currentQuestion.w.toLowerCase();
        const fb = document.getElementById('gameFeedback');
        if (userWord === targetWord) {
          stars += 2;
          streak += 1;
          document.getElementById('starCount').textContent = stars;
          document.getElementById('streakBadge').textContent = `🔥 连对 ${streak}`;
          fb.innerHTML = `<span class="text-emerald-600 star-pop">🎉 太棒了！拼读完全正确 (+2 ⭐)</span>`;
          window.speechSynthesis.cancel();
          setTimeout(() => playNormalWord(currentQuestion.w), 300);
        } else {
          streak = 0;
          document.getElementById('streakBadge').textContent = `🔥 连对 0`;
          fb.innerHTML = `<span class="text-rose-600">🤔 差一点点哦，点【🔄 重拼本题】再试一次！</span>`;
        }
      }
    }

    function resetCurrentQuestion() {
      if (currentQuestion) {
        const pureTokens = currentQuestion.b.filter(t => t !== '.' && t !== ' ' && t !== '-');
        userBlocks = [];
        renderBlockBuildQuestion(pureTokens);
      }
    }

    function nextGameQuestion() {
      gameIdx++;
      loadGameQuestion();
    }

    function playGameAudio(isSlow) {
      if (!currentQuestion) return;
      if (isSlow) {
        playWordSlowBlend(currentQuestion, 'gameSlots');
      } else {
        playNormalWord(currentQuestion.w);
      }
    }

    // ==================== 8. AUDIT TABLE ====================
    function renderAuditTable() {
      const showAll = document.getElementById('tableShowAllUnits')?.checked;
      const list = showAll ? KB1_WORDS : getUnitWords(currentUnit);
      const tbody = document.getElementById('auditTableBody');
      if (!tbody) return;

      tbody.innerHTML = list.map((item, idx) => {
        const pureBlocks = item.b.filter(t => t !== '.' && t !== '-');
        const graphemesHTML = pureBlocks.map(tok => {
          if (tok === ' ') return `<span class="text-slate-300 mx-1">/</span>`;
          const info = PHONEME_DICT[tok];
          const disp = info?.display || tok;
          const bg = info?.k === 'v' ? 'bg-amber-100 text-amber-900 border-amber-400' : (info?.k === 's' ? 'bg-slate-100 text-slate-400 border-dashed border-slate-400' : 'bg-blue-100 text-blue-900 border-blue-400');
          const escapedTok = tok.replace(/'/g, "\\'");
          return `<button onclick="playPhonicsToken('${escapedTok}', this)" class="px-1.5 py-0.5 rounded border ${bg} font-mono text-xs mr-1 hover:scale-105 transition-transform">${disp}</button>`;
        }).join('');

        const ipaBlocksHTML = pureBlocks.map(tok => {
          if (tok === ' ') return `<span class="text-slate-300 mx-0.5"> </span>`;
          const info = PHONEME_DICT[tok];
          return `<span class="font-mono text-xs px-1 py-0.5 rounded bg-slate-100 text-slate-700 mr-1">${info?.ipa || ''}</span>`;
        }).join('');

        const escapedWord = item.w.replace(/'/g, "\\'");
        return `
          <tr class="hover:bg-amber-50/40">
            <td class="p-2.5 font-black text-slate-500">${item.u.toUpperCase()}</td>
            <td class="p-2.5">
              <button onclick="playNormalWord('${escapedWord}')" class="font-black text-slate-900 hover:text-indigo-600 flex items-center gap-1">
                <span>🔊</span> <span>${item.w}</span>
              </button>
            </td>
            <td class="p-2.5 text-slate-600">${item.zh}</td>
            <td class="p-2.5 font-mono text-indigo-700">${item.ipa}</td>
            <td class="p-2.5">${graphemesHTML}</td>
            <td class="p-2.5">${ipaBlocksHTML}</td>
            <td class="p-2.5 text-xs text-slate-600">${item.tip}</td>
          </tr>
        `;
      }).join('');
    }

    // ==================== 9. MODE SWITCHING ====================
    function switchMode(mode) {
      stopAutoPlay();
      currentMode = mode;
      const modes = ['deck', 'game', 'table'];
      modes.forEach(m => {
        const btn = document.getElementById('tab' + m.charAt(0).toUpperCase() + m.slice(1));
        const sec = document.getElementById(m + 'Section');
        if (!btn || !sec) return;
        if (m === mode) {
          btn.className = 'px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm transition-all bg-amber-400 text-slate-900 border-2 border-slate-800 shadow-[1.5px_1.5px_0px_#1E293B] flex items-center gap-1';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-black text-xs sm:text-sm transition-all text-slate-700 hover:text-slate-900 flex items-center gap-1';
          sec.classList.add('hidden');
        }
      });

      if (mode === 'deck') {
        renderBigCard();
        renderDeckThumbs();
      } else if (mode === 'game') {
        initGameQueue();
      } else if (mode === 'table') {
        renderAuditTable();
      }
    }

    // Touch Swipe Support
    (function setupTouchSwipe() {
      let startX = 0;
      let startY = 0;
      const area = document.getElementById('deckTouchArea');
      if (!area) return;
      area.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
      }, { passive: true });
      area.addEventListener('touchend', e => {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - startX;
          const dy = e.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            stepDeck(dx < 0 ? 1 : -1);
          }
        }
      }, { passive: true });
    })();

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      initUKVoiceEngine();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = initUKVoiceEngine;
      }
      renderUnitTabs();
      renderBigCard();
      renderDeckThumbs();
    });
  </script>
</body>
</html>
